name: Verify

on:
  pull_request:
  # 2026-09-15: this said `branches: [master]`. There is no master branch — the
  # default branch is codex/knowledge-openwiki-hardening — so the push trigger has
  # never fired and nothing has ever been built from a merge. P-00099 finding 3.
  push:
    branches: [codex/knowledge-openwiki-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_id: ${{ steps.image.outputs.image_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install pip==26.1.2
          python -m pip install --require-hashes --requirement requirements.lock
          python -m pip install pytest==9.0.2 ruff==0.15.13
          python -m pip check

      - name: Test and static validation
        run: |
          python -m pytest -q
          python -m knowledge_ops.cli evaluate-memory
          ruff check knowledge_ops tests
          python -m compileall -q knowledge_ops tests
          find knowledge_ops/static/ui -name '*.js' -print0 | xargs -0 -n1 node --check
          docker compose config --quiet
          docker compose --profile worker config --quiet
          docker compose -f docker-compose.yml -f docker-compose.bigboy.yml \
            --profile worker config --quiet
          test -x scripts/backup.sh
          test -x scripts/restore_verify.sh
          test -x scripts/verify_container_operations.sh
          test -x scripts/promote_customer_image.sh
          sh -n scripts/backup.sh scripts/restore_verify.sh scripts/verify_container_operations.sh \
            scripts/promote_customer_image.sh

      - name: Build and validate the production image
        id: image
        run: |
          set -eu
          SHA="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short=12 HEAD)"
          docker build \
            --label org.opencontainers.image.revision="$SHA" \
            --label org.opencontainers.image.source="https://git.unicorncommander.ai/UnicornCommander/Knowledge-Ops" \
            --tag "knowledge-ops:0.7.2-customer-$SHORT" .
          IMAGE_ID="$(docker image inspect "knowledge-ops:0.7.2-customer-$SHORT" --format '{{.Id}}')"
          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          docker run --rm "$IMAGE_ID" python -m pip check
          docker run --rm "$IMAGE_ID" python -m knowledge_ops.cli evaluate-memory
          scripts/verify_container_operations.sh "$IMAGE_ID"
          docker save --output /tmp/knowledge-ops-ci.tar "$IMAGE_ID"
          scripts/scan_image_archive.sh /tmp/knowledge-ops-ci.tar /tmp/knowledge-ops.cdx.json \
            --format cyclonedx --no-progress
          python -c 'import json; value=json.load(open("/tmp/knowledge-ops.cdx.json")); assert value["bomFormat"] == "CycloneDX" and value["components"]'

      - name: Upload production image SBOM
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2; Forgejo artifact protocol
        with:
          name: knowledge-ops-cyclonedx-sbom
          path: /tmp/knowledge-ops.cdx.json
          if-no-files-found: error
          retention-days: 30

  # ── Vulnerability audit ───────────────────────────────────────────────────────
  # Split out of test-and-build on 2026-09-15. Rationale: a vulnerability scan is a
  # RELEASE gate, not a correctness gate. Left inside test-and-build it also blocked
  # `customer-image` (needs:), which meant a pre-existing CVE backlog made it
  # impossible for CI to produce ANY customer image — the exact thing P-00099
  # finding 3 needs CI to do. Nothing is suppressed: this job still fails on
  # HIGH/CRITICAL, stays visible on every PR, and still gates the registry publish.
  #
  # The previous base/lock were RED on 2026-09-15. The dependency update pins
  # sqlite-libs 3.53.4-r0 (in the Python base) and cryptography 50.0.0. Keep
  # scanning the built image: a source update alone does not prove a clean image.
  #   sqlite-libs CVE-2026-11822 / CVE-2026-11824 — arbitrary code execution via
  #     crafted FTS5 database data. Ordinary document ingestion alone does not
  #     establish exploitability; upstream describes arbitrary SQL or a crafted
  #     database as prerequisites. See https://www.sqlite.org/cves.html.
  #   cryptography 49.0.0 CVE-2026-69247 — Bleichenbacher oracle. Fix = 50.0.0.
  # Dependency changes remain separately reviewable from the seed-corpus fix.
  vuln-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test-and-build
    env:
      KO_IMAGE: ${{ needs.test-and-build.outputs.image_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Audit locked runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement requirements.lock

      - name: Scan the production image for HIGH/CRITICAL vulnerabilities
        run: |
          set -eu
          # Scan the exact image tested above, never a second build or mutable tag.
          test -n "$KO_IMAGE"
          docker image inspect "$KO_IMAGE" >/dev/null
          docker save --output /tmp/knowledge-ops-audit.tar "$KO_IMAGE"
          scripts/scan_image_archive.sh /tmp/knowledge-ops-audit.tar /tmp/knowledge-ops-audit.txt \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress
          cat /tmp/knowledge-ops-audit.txt

  # Customer and vulnerability gates consume the same immutable image ID. The
  # existing runner shares its host Docker daemon between jobs; fail closed if
  # that artifact is unavailable. PRs exercise every gate but never publish.
  customer-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-and-build
    env:
      KO_IMAGE: ${{ needs.test-and-build.outputs.image_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select the tested customer image
        run: |
          set -eu
          test -n "$KO_IMAGE"
          docker image inspect "$KO_IMAGE" >/dev/null
          echo "KO_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Assert the image ships NO seed corpus
        run: |
          set -eu
          # The whole finding, as three assertions. Any of them failing means an
          # image that could re-seed a customer KB with our documents.
          baked="$(docker run --rm --entrypoint sh "$KO_IMAGE" -c \
            'find /opt/knowledge-ops/wiki /wiki -name "*.md" 2>/dev/null | sort')"
          if [ -n "$baked" ]; then
            echo "FAIL: seed markdown baked into the customer image:" >&2
            echo "$baked" >&2
            exit 1
          fi
          edition="$(docker image inspect "$KO_IMAGE" \
            --format '{{index .Config.Labels "org.magicunicorn.knowledge-ops.seed-corpus"}}')"
          test "$edition" = "none" || { echo "FAIL: seed-corpus label is '$edition', want 'none'" >&2; exit 1; }
          rev="$(docker image inspect "$KO_IMAGE" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$rev" = "$KO_SHA" || { echo "FAIL: revision label '$rev' != '$KO_SHA'" >&2; exit 1; }
          echo "OK: $KO_IMAGE ships no seed corpus, edition=none, revision=$rev"

      - name: Assert the runtime seed gate defaults OFF in the image
        run: |
          set -eu
          # Belt and braces: even if markdown reaches /wiki later (a restored volume,
          # a careless docker cp), a customer instance must not ingest it.
          docker run --rm --entrypoint python "$KO_IMAGE" -c '
          from knowledge_ops.config import Settings
          s = Settings()
          assert s.seed_internal_corpus is False, "seed_internal_corpus defaults ON in the image"
          print("OK: KNOWLEDGE_OPS_SEED_INTERNAL_CORPUS defaults off")'
          docker run --rm --entrypoint python "$KO_IMAGE" -c 'import knowledge_ops.api; print("OK: app imports")'

      - name: Assert the build guard actually refuses an internal corpus
        run: |
          set -eu
          # Prove the guard, do not trust it. Plant a document the way bigboy's
          # deploy tree holds one, and require the build to go red.
          mkdir -p wiki/marketing
          printf '# planted by CI\n' > wiki/marketing/guard-probe.md
          if docker build --tag knowledge-ops:guard-probe . >/tmp/guard.log 2>&1; then
            echo "FAIL: build SUCCEEDED with seed markdown present — the guard is dead" >&2
            docker rmi -f knowledge-ops:guard-probe || true
            rm -rf wiki/marketing
            exit 1
          fi
          grep -q "BUILD REFUSED" /tmp/guard.log || {
            echo "FAIL: build failed, but not on the guard:" >&2; tail -30 /tmp/guard.log >&2; exit 1; }
          echo "OK: the guard refused a planted internal corpus"
          rm -rf wiki/marketing

      - name: Record what was built
        run: |
          docker image inspect "$KO_IMAGE" \
            --format 'built {{.Id}} rev={{index .Config.Labels "org.opencontainers.image.revision"}} seed-corpus={{index .Config.Labels "org.magicunicorn.knowledge-ops.seed-corpus"}}'

  # Publish only after correctness, corpus and vulnerability gates pass. Manual
  # runs on review branches can build/verify but cannot publish to the registry.
  publish-customer-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-and-build, customer-image, vuln-audit]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/codex/knowledge-openwiki-hardening'
    env:
      KO_IMAGE: ${{ needs.test-and-build.outputs.image_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Publish the customer image
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
        run: |
          set -eu
          # Same pattern as Unicorn-Amanuensis-astra-extract/.forgejo/workflows/images.yml.
          # REGISTRY_USER / REGISTRY_TOKEN are UnicornCommander ORG Actions secrets
          # (service user amanuensis-ci, team ci-publishers, includes_all_repositories),
          # so this repo inherits them.
          : "${REGISTRY_TOKEN:?Registry token is required for publication}"
          : "${REGISTRY_USER:?Registry user is required for publication}"
          PREFIX=git.unicorncommander.ai/unicorncommander/knowledge-ops
          SHORT="$(git rev-parse --short=12 HEAD)"
          LOCAL="$KO_IMAGE"
          test -n "$LOCAL"
          docker image inspect "$LOCAL" >/dev/null
          edition="$(docker image inspect "$LOCAL" --format '{{index .Config.Labels "org.magicunicorn.knowledge-ops.seed-corpus"}}')"
          test "$edition" = "none" || { echo "refusing to publish edition '$edition'" >&2; exit 1; }
          rev="$(docker image inspect "$LOCAL" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$rev" = "$(git rev-parse HEAD)" || { echo "refusing revision mismatch" >&2; exit 1; }
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login git.unicorncommander.ai -u "$REGISTRY_USER" --password-stdin
          docker tag "$LOCAL" "$PREFIX:0.7.2-customer-$SHORT"
          docker tag "$LOCAL" "$PREFIX:customer"
          docker push "$PREFIX:0.7.2-customer-$SHORT"
          docker push "$PREFIX:customer"
          docker image inspect "$PREFIX:0.7.2-customer-$SHORT" --format '{{json .RepoDigests}}'
