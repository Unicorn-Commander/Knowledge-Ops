name: Verify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install pip==26.1.2
          python -m pip install --require-hashes --requirement requirements.lock
          python -m pip install pytest==9.0.2 ruff==0.15.13
          python -m pip check

      - name: Test and static validation
        run: |
          python -m pytest -q
          python -m knowledge_ops.cli evaluate-memory
          ruff check knowledge_ops tests
          python -m compileall -q knowledge_ops tests
          node --check knowledge_ops/static/app.js
          docker compose config --quiet
          docker compose --profile worker config --quiet
          docker compose -f docker-compose.yml -f docker-compose.bigboy.yml \
            --profile worker config --quiet
          test -x scripts/backup.sh
          test -x scripts/restore_verify.sh
          test -x scripts/verify_container_operations.sh
          sh -n scripts/backup.sh scripts/restore_verify.sh scripts/verify_container_operations.sh

      - name: Audit locked runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement requirements.lock

      - name: Build and validate the production image
        run: |
          docker build --tag knowledge-ops:ci .
          docker run --rm knowledge-ops:ci python -m pip check
          docker run --rm knowledge-ops:ci python -m knowledge_ops.cli evaluate-memory
          docker tag knowledge-ops:ci knowledge-ops:0.4.0
          scripts/verify_container_operations.sh knowledge-ops:0.4.0
          docker save --output /tmp/knowledge-ops-ci.tar knowledge-ops:ci
          docker run --rm --volume /tmp:/scan \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --input /scan/knowledge-ops-ci.tar --format cyclonedx \
            --output /scan/knowledge-ops.cdx.json --no-progress
          python -c 'import json; value=json.load(open("/tmp/knowledge-ops.cdx.json")); assert value["bomFormat"] == "CycloneDX" and value["components"]'
          docker run --rm --volume /tmp:/scan:ro \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --input /scan/knowledge-ops-ci.tar --scanners vuln \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress

      - name: Upload production image SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-ops-cyclonedx-sbom
          path: /tmp/knowledge-ops.cdx.json
          if-no-files-found: error
          retention-days: 30
