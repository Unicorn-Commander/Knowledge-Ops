<!DOCTYPE html>
<!-- No hardcoded data-theme: tokens.css :root defaults to aurora, its
     prefers-color-scheme:light block serves daylight to un-themed light-OS
     first visits, and ui/theme.js stamps the persisted/preferred theme at boot.
     Shell v2 ("Observatory"): #sky is the app's substrate — one always-alive
     constellation canvas behind everything. The bar, dock, panes, and lens
     float over it; shell.js choreographs camera + panes per route. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Knowledge-Ops — Constellation</title>
  <meta name="description" content="Watch your organization think. Magic Unicorn's governed organizational memory — evidence-first retrieval with source-level citations." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%239b7cf6'/%3E%3Cstop offset='1' stop-color='%2346c2b3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' font-family='Georgia,serif' font-weight='700' fill='%2307050b'%3EK%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="ui/fonts.css" />
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/base.css" />
  <style>
    /* Shell-owned STRUCTURAL styles only. All visual design lives in ui/base.css;
       every color below references a token from ui/tokens.css. */
    .visually-hidden { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    /* theme switcher menu (drops from the bar) */
    .theme-menu { position: relative; }
    .theme-menu__list { position: absolute; right: 0; top: calc(100% + .45rem); min-width: 15rem; z-index: 60; padding: .35rem; display: flex; flex-direction: column; gap: .1rem; }
    .theme-menu__list[hidden] { display: none !important; } /* authored display beats the UA [hidden] rule — restate it */
    .theme-menu__item { display: flex; align-items: center; justify-content: space-between; gap: .9rem; width: 100%; min-height: 44px; padding: .45rem .7rem; border: 0; background: transparent; color: var(--mu-color-text); font: inherit; text-align: left; border-radius: var(--mu-radius-sm); cursor: pointer; }
    .theme-menu__item:hover { background: var(--mu-color-surface-strong); }
    .theme-menu__item:focus-visible { outline: 2px solid var(--mu-color-accent); outline-offset: -2px; }
    .theme-menu__mark { opacity: 0; width: .5rem; height: .5rem; border-radius: 50%; background: var(--mu-color-accent); flex: none; }
    .theme-menu__item[aria-checked="true"] .theme-menu__mark { opacity: 1; }
  </style>
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to content</a>

  <!-- the substrate: one constellation, always alive, behind everything -->
  <div id="sky" aria-hidden="true"></div>

  <header class="bar">
    <a class="brand" href="#home">
      <span class="brand__name">Knowledge<b>-Ops</b></span>
      <span class="brand__tag">Observatory</span>
    </a>
    <span class="bar__context" id="barContext" aria-hidden="true"></span>
    <span class="bar__spacer"></span>
    <span class="readout" id="barReadout">
      <span id="readoutStats"></span>
      <span class="readout__pulse" role="status" aria-live="polite"><span class="dot" id="statusDot"></span> <span id="statusText">Checking</span></span>
    </span>
    <div id="themeMenuHost"></div>
  </header>

  <nav class="dock" id="dock" aria-label="Views">
    <a class="dock__btn" data-view="home" href="#home" aria-label="Home">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4l7 8-7 8-7-8z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </a>
    <a class="dock__btn" data-view="ask" href="#ask" aria-label="Ask">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/></svg>
    </a>
    <a class="dock__btn" data-view="library" href="#library" aria-label="Library">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5.5" y="4" width="13" height="16" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M9 9h6M9 13h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </a>
    <a class="dock__btn" data-view="review" href="#review" aria-label="Review">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="dock__btn" data-view="files" href="#files" aria-label="Files">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 4h8l4 4v12H6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 4v4h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </a>
    <a class="dock__btn" data-view="sources" href="#sources" aria-label="Sources">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="2.6" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="17" r="2.6" stroke="currentColor" stroke-width="1.6"/><path d="M9 9l6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </a>
    <a class="dock__btn" data-view="graph" href="#graph" aria-label="Graph">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.8 15.5L11.3 8M13.5 8.6l3.6 4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="6" cy="17" r="1.9" fill="currentColor"/><circle cx="12.3" cy="6.4" r="1.9" fill="currentColor"/><circle cx="18" cy="14.3" r="1.9" fill="currentColor"/></svg>
    </a>
    <a class="dock__btn" data-view="ops" href="#ops" aria-label="Operations">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 17a7.5 7.5 0 0 1 15 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 17l3.4-4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </a>
  </nav>

  <main class="main" id="mainContent" tabindex="-1">
    <!-- View modules own everything inside their <section>; the shell toggles
         visibility and stamps html[data-route]. home + graph are .view--bleed:
         chromeless, the sky itself is their surface. -->
    <section class="view view--bleed" id="view-home" hidden aria-label="Home"></section>
    <section class="view" id="view-ask" hidden aria-label="Ask"></section>
    <section class="view" id="view-library" hidden aria-label="Library"></section>
    <section class="view" id="view-review" hidden aria-label="Review"></section>
    <section class="view" id="view-files" hidden aria-label="Files"></section>
    <section class="view" id="view-sources" hidden aria-label="Sources"></section>
    <section class="view view--bleed" id="view-graph" hidden aria-label="Graph"></section>
    <section class="view" id="view-ops" hidden aria-label="Operations"></section>
    <noscript><div class="error" style="margin:2rem;">Knowledge-Ops needs JavaScript to render the constellation. Enable it and reload.</div></noscript>
  </main>

  <!-- the lens: ask + command + jump, mounted by ui/lens.js -->
  <div id="lensHost"></div>

  <dialog class="citation-dialog" id="citationDialog" aria-labelledby="citationTitle">
    <div class="dialog__head">
      <div>
        <p class="kicker">Source span</p>
        <h2 class="section section--flush" id="citationTitle">Citation inspection</h2>
      </div>
      <button type="button" class="dialog__close" id="citationClose" aria-label="Close citation inspection">×</button>
    </div>
    <div id="citationContent" aria-live="polite"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="ui/shell.js"></script>
</body>
</html>
