<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Knowledge-Ops — the Stargazer, a unicorn drawn as a constellation">
  <!-- The Stargazer: a unicorn head drawn the way the product draws knowledge —
       stars joined by hairlines. Wedge horn, upright ear, long muzzle, three
       mane streaks. Brand: violet #A78BFA → teal #4ED3C2; the eye is
       observatory brass #D9A96C. -->
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.05" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke="#8f86c9" stroke-opacity="0.6" stroke-width="1.05" fill="none" stroke-linecap="round">
    <!-- horn: a real wedge to a bright tip -->
    <path d="M66 34 88 10"/>
    <path d="M74 40 88 10"/>
    <path d="M66 34 74 40"/>
    <!-- ear -->
    <path d="M60 36 54 24 66 32"/>
    <!-- face line: brow → muzzle → nose → lip → jaw -->
    <path d="M66 34 72 46 90 52 100 60 96 68 84 71"/>
    <path d="M84 71 70 80 56 85"/>
    <!-- back of head → neck → chest -->
    <path d="M60 36 46 44 34 58 28 76 46 99"/>
    <path d="M56 85 46 99"/>
    <!-- mane streaks flowing back -->
    <path d="M46 44 33 49"/>
    <path d="M43 58 29 63"/>
    <path d="M40 72 29 80"/>
  </g>
  <g filter="url(#soft)">
    <circle cx="88" cy="10" r="2.8" fill="#4ed3c2"/>
    <circle cx="66" cy="34" r="2.0" fill="#a78bfa"/>
    <circle cx="74" cy="40" r="1.7" fill="#ece9f8"/>
    <circle cx="54" cy="24" r="1.9" fill="#a78bfa"/>
    <circle cx="60" cy="36" r="1.5" fill="#ece9f8"/>
    <circle cx="72" cy="46" r="1.5" fill="#ece9f8"/>
    <circle cx="90" cy="52" r="1.8" fill="#a78bfa"/>
    <circle cx="100" cy="60" r="2.4" fill="#4ed3c2"/>
    <circle cx="96" cy="68" r="1.5" fill="#ece9f8"/>
    <circle cx="84" cy="71" r="1.8" fill="#a78bfa"/>
    <circle cx="70" cy="80" r="1.5" fill="#ece9f8"/>
    <circle cx="56" cy="85" r="1.8" fill="#a78bfa"/>
    <circle cx="46" cy="99" r="2.3" fill="#4ed3c2"/>
    <circle cx="46" cy="44" r="1.6" fill="#ece9f8"/>
    <circle cx="34" cy="58" r="1.8" fill="#a78bfa"/>
    <circle cx="28" cy="76" r="2.0" fill="#4ed3c2"/>
    <circle cx="33" cy="49" r="1.3" fill="#ece9f8"/>
    <circle cx="29" cy="63" r="1.3" fill="#ece9f8"/>
    <circle cx="29" cy="80" r="1.3" fill="#ece9f8"/>
  </g>
  <!-- the eye: brightest star in the constellation, observatory brass -->
  <circle cx="74" cy="53" r="3" fill="#d9a96c" filter="url(#soft)"/>
</svg>
