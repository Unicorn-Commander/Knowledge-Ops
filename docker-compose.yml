# Knowledge-Ops base compose — standalone / Mac-runnable.
# Live store adapters (Qdrant/FalkorDB) are OFF here so this comes up anywhere.
# For bigboy (next to the real stores + Brigade), layer the override:
#   docker compose -f docker-compose.yml -f docker-compose.bigboy.yml up -d
services:
  knowledge-ops:
    build: .
    image: knowledge-ops:0.7.1
    container_name: knowledge-ops
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      # SQLite + WAL persist across restarts/redeploys.
      - knowledge_ops_data:/data
      - knowledge_ops_wiki:/wiki
    environment:
      KNOWLEDGE_OPS_DATA: /data
      KNOWLEDGE_OPS_DB: /data/knowledge_ops.sqlite3
      KNOWLEDGE_OPS_WIKI: /wiki
      KNOWLEDGE_OPS_OPENWIKI_STAGING: /data/openwiki/staging
      # Image-baked seed corpus: OFF, and it stays off for every customer and
      # per-org deploy. seed_wiki_from_disk() ingests every *.md under /wiki as
      # scope=global owner=magic-unicorn, i.e. readable by everyone on the
      # instance. On 2026-09-15 that had put two Magic Unicorn internal documents
      # into the customer-facing KB with no human involved (P-00099 finding 3).
      # Only the internal ring sets this to "1" — see docker-compose.bigboy.yml.
      KNOWLEDGE_OPS_SEED_INTERNAL_CORPUS: "0"
      # Explicit local-dev trust boundary: unauthenticated API is bound only to
      # 127.0.0.1 above. Production override resets this to authenticated.
      KNOWLEDGE_OPS_API_REQUIRE_AUTH: "0"
      # Live adapters default OFF. Enable via the bigboy override (or set =1 here
      # plus the matching *_URL envs if your stores are reachable).
      KNOWLEDGE_OPS_ENABLE_QDRANT: "0"
      KNOWLEDGE_OPS_ENABLE_FALKORDB: "0"
      KNOWLEDGE_OPS_ENABLE_CENTER_DEEP: "0"
      # API readiness reports worker state, but standalone API-only development
      # does not require the optional worker profile.
      KNOWLEDGE_OPS_REQUIRE_WORKER: "${KNOWLEDGE_OPS_REQUIRE_WORKER:-0}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/ready', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  knowledge-ops-worker:
    profiles: ["worker"]
    build: .
    image: knowledge-ops:0.7.1
    container_name: knowledge-ops-worker
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    command: ["knowledge-ops", "worker"]
    volumes:
      - knowledge_ops_data:/data
      - knowledge_ops_wiki:/wiki
    environment:
      KNOWLEDGE_OPS_DATA: /data
      KNOWLEDGE_OPS_DB: /data/knowledge_ops.sqlite3
      KNOWLEDGE_OPS_WIKI: /wiki
      KNOWLEDGE_OPS_OPENWIKI_STAGING: /data/openwiki/staging
      KNOWLEDGE_OPS_WORKER_ID: knowledge-ops-worker
      KNOWLEDGE_OPS_ENABLE_QDRANT: "0"
      KNOWLEDGE_OPS_ENABLE_FALKORDB: "0"
      KNOWLEDGE_OPS_ENABLE_CENTER_DEEP: "0"
      # No live adapter is imported or activated by the base image. Source
      # deletion targets are logical names only and default to an empty map.
      KNOWLEDGE_OPS_DELETION_TARGETS: "{}"
    healthcheck:
      test: ["CMD", "knowledge-ops", "worker-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  knowledge_ops_data:
  knowledge_ops_wiki:
