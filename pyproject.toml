[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-ops"
version = "0.4.0"
description = "Magic Unicorn governed evidence and memory layer"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn==0.40.0",
  "pydantic==2.12.5",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.9",
  "PyYAML==6.0.3",
  # /mcp Brigade-JWT verification (lazy: only used when KNOWLEDGE_OPS_MCP_REQUIRE_JWT=1)
  "pyjwt[crypto]==2.15.0",
  "certifi>=2026.10.19",
]

[project.optional-dependencies]
# MCP stdio runtime (kb.* tools for Brigade / Claude Desktop / Cursor).
mcp = ["mcp>=1.30.0,<2"]
# Live store adapters: Qdrant uses httpx (already a core dep); FalkorDB needs a
# RedisGraph client. Install with: pip install 'knowledge-ops[live]'
live = ["redis==5.3.1"]
all = ["mcp>=1.30.0,<2", "redis==5.3.1"]
test = ["pytest==9.0.2", "ruff==0.15.13"]

[project.scripts]
knowledge-ops = "knowledge_ops.cli:main"

[tool.setuptools.packages.find]
include = ["knowledge_ops*"]
namespaces = true

[tool.setuptools.package-data]
knowledge_ops = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
